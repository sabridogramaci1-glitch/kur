<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>USDT &amp; TRX / TRY</title>
<meta name="theme-color" content="#12151c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kur">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root{
    --bg:#12151c; --kart:#1b202b; --cizgi:#262c3a;
    --yazi:#e8eaf0; --soluk:#8b93a7;
    --yesil:#2ecc71; --kirmizi:#ff5c5c; --sari:#f5c24a;
    --usdt-renk:#26A17B; --trx-renk:#FF3B4E;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--yazi)}
  body{
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    padding:calc(env(safe-area-inset-top,0px) + 20px) 16px
            calc(env(safe-area-inset-bottom,0px) + 32px);
    -webkit-text-size-adjust:100%;
  }
  .sar{max-width:720px;margin:0 auto}
  h1{font-size:12px;letter-spacing:.14em;color:var(--soluk);margin:0 0 14px;font-weight:600}
  .kartlar{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:560px){.kartlar{grid-template-columns:1fr;gap:10px}}
  .kart{background:var(--kart);border-radius:16px;padding:14px 16px}
  .ad{font-size:12px;font-weight:600;color:var(--soluk);letter-spacing:.04em;
       display:flex;align-items:center;gap:7px}
  .ad svg{width:19px;height:19px;flex:none;display:block}
  .fiyat{font-size:38px;font-weight:700;line-height:1.1;margin:2px 0 0;
         font-variant-numeric:tabular-nums;transition:color .2s}
  .degisim{font-size:14px;font-weight:600;margin-top:2px}
  .kucuk{font-size:11px;color:var(--soluk);margin-top:5px;font-variant-numeric:tabular-nums}
  .yesil{color:var(--yesil)} .kirmizi{color:var(--kirmizi)} .notr{color:var(--yazi)}
  h2{font-size:11px;letter-spacing:.14em;color:var(--soluk);margin:22px 0 8px;font-weight:600}
  table{width:100%;border-collapse:collapse;background:var(--kart);
        border-radius:16px;overflow:hidden}
  th{font-size:11px;color:var(--soluk);font-weight:600;text-align:right;padding:12px 16px 6px}
  th:first-child{text-align:left}
  th .bslk{display:inline-flex;align-items:center;gap:6px}
  th .bslk svg{width:16px;height:16px;flex:none;display:block}
  td{padding:12px 16px;border-top:1px solid var(--cizgi);font-variant-numeric:tabular-nums}
  td:first-child{font-size:15px;white-space:nowrap}
  td:not(:first-child){text-align:right;font-size:16px;font-weight:700;
    font-family:ui-monospace,Consolas,"SF Mono",monospace}
  td.d-USDTTRY{color:var(--usdt-renk)}
  td.d-TRXTRY{color:var(--trx-renk)}
  tbody tr:first-child td{border-top:none}
  .alt{display:flex;justify-content:space-between;align-items:center;
       gap:12px;margin-top:14px;font-size:12px;color:var(--soluk)}
  .nokta{display:inline-block;width:7px;height:7px;border-radius:50%;
         background:var(--yesil);margin-right:6px;vertical-align:middle}
  .kopuk .nokta{background:var(--kirmizi)}
  .kopuk{color:var(--kirmizi)}
  .fp{margin-top:8px;padding:0}
  .fp-ust{padding:12px 16px 8px;display:flex;flex-direction:column;gap:8px}
  .fp-satir{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .fp-kur{display:flex;align-items:center;gap:7px;font-size:14px;
          font-variant-numeric:tabular-nums}
  .fp-kur svg{width:17px;height:17px;flex:none;display:block}
  .fp-kur b{font-weight:700}
  .fp-kur.k-USDTTRY b{color:var(--usdt-renk)}
  .fp-kur.k-TRXTRY b{color:var(--trx-renk)}
  .fp-ayar{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--soluk)}
  .fp-ayar input{width:62px;background:var(--bg);color:var(--yazi);
    border:1px solid var(--cizgi);border-radius:7px;padding:5px 7px;
    font:inherit;font-size:12px;text-align:right}
  .fp table{border-radius:0}
  .fp td.fp-usdt{color:var(--usdt-renk)}
  .fp-not{font-size:11px;color:var(--soluk);padding:10px 16px 14px;line-height:1.5;margin:0}
</style>
</head>
<body>
<div class="sar">
  <h1>USDT &amp; TRX / TRY &nbsp;·&nbsp; BINANCE</h1>
  <div class="kartlar" id="kartlar"></div>

  <h2>TL KARSILIGI</h2>
  <table>
    <thead><tr id="baslik"><th>Tutar</th></tr></thead>
    <tbody id="govde"></tbody>
  </table>

  <h2>FULGURPAY (YAKLASIK)</h2>
  <div class="kart fp">
    <div class="fp-ust" id="fp-ust"></div>
    <table>
      <thead><tr id="fp-baslik"><th>Bakiye</th></tr></thead>
      <tbody id="fp-govde"></tbody>
    </table>
    <p class="fp-not">Binance fiyatinin uzerine her parite icin girdigin yuzde
      eklenerek hesaplanir. Sitede gordugun kur degisirse yuzdeyi guncelle.
      Ag ucreti dahil degildir.</p>
  </div>

  <div class="alt">
    <span>3 saniyede bir guncellenir</span>
    <span id="durum"><span class="nokta"></span>baglaniyor...</span>
  </div>
</div>

<script>
const PARITELER = [
  {sembol:"USDTTRY", ad:"USDT", basamak:2, logo:`<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="#26A17B"/><path fill="#fff" d="M13.31 10.52V9.09h3.43V6.8H7.28v2.29h3.43v1.43c-2.79.13-4.88.68-4.88 1.34 0 .66 2.09 1.21 4.88 1.34v4.58h2.6v-4.58c2.78-.13 4.87-.68 4.87-1.34 0-.66-2.09-1.21-4.87-1.34zm0 2.25c-.07 0-.43.03-1.23.03-.64 0-1.1-.02-1.26-.03-2.48-.11-4.33-.54-4.33-1.06 0-.52 1.85-.95 4.33-1.06v1.7c.16.01.63.04 1.27.04.76 0 1.15-.03 1.22-.04v-1.7c2.47.11 4.32.54 4.32 1.06 0 .52-1.85.95-4.32 1.06z"/></svg>`},
  {sembol:"TRXTRY",  ad:"TRX",  basamak:3, logo:`<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="#EF0027"/><path fill="#fff" d="M18.2 8.06 5.9 5.8l6.53 14.6 8.57-10.4-2.8-1.94zm-.33 1.3 1.6 1.11-4.46.81 2.86-1.92zM13.02 10.9 7.98 7.5l8.03 1.47-2.99 1.93zm-.41 1.07.93 6.77-4.6-10.3 3.67 3.53zm1.03.35 4.82-.88-4.62 5.6-.2-4.72z"/></svg>`},
];
const TUTARLAR = [5000, 10000, 20000, 25000, 50000, 100000, 150000, 200000];
const YENILEME_MS = 3000;

// FulgurPay kurunun Binance ustu farki (%), parite bazinda olculen degerler
const FP_VARSAYILAN = {USDTTRY: 0.26, TRXTRY: 0.27};

const bicim = (x, b=2) => new Intl.NumberFormat("tr-TR",
  {minimumFractionDigits:b, maximumFractionDigits:b}).format(x);

document.getElementById("kartlar").innerHTML = PARITELER.map(p => `
  <div class="kart">
    <div class="ad">${p.logo}<span>${p.ad} / TRY</span></div>
    <div class="fiyat" id="f-${p.sembol}">--,--</div>
    <div class="degisim" id="d-${p.sembol}">--</div>
    <div class="kucuk" id="r-${p.sembol}">24s --</div>
    <div class="kucuk" id="s-${p.sembol}">alis -- &nbsp;·&nbsp; satis -- &nbsp;·&nbsp; makas --</div>
  </div>`).join("");

document.getElementById("baslik").insertAdjacentHTML("beforeend",
  PARITELER.map(p => `<th><span class="bslk">${p.logo}<span>${p.ad}</span></span></th>`).join(""));

document.getElementById("govde").innerHTML = TUTARLAR.map(t => `
  <tr>
    <td>${bicim(t,0)} &#8378;</td>
    ${PARITELER.map(p => `<td class="d-${p.sembol}" id="t-${p.sembol}-${t}">--</td>`).join("")}
  </tr>`).join("");

// --- FulgurPay bolumu ---
const fpKutular = {};
const sonFiyat = {};

document.getElementById("fp-ust").innerHTML = PARITELER.map(p => `
  <div class="fp-satir">
    <div class="fp-kur k-${p.sembol}">${p.logo}
      <span>1 ${p.ad} = <b id="fp-kur-${p.sembol}">--</b> &#8378;</span>
    </div>
    <label class="fp-ayar">fark %
      <input id="fp-prim-${p.sembol}" type="number" step="0.01" min="-5" max="10">
    </label>
  </div>`).join("");

document.getElementById("fp-baslik").insertAdjacentHTML("beforeend",
  PARITELER.map(p => `<th>${p.ad}</th>`).join(""));

document.getElementById("fp-govde").innerHTML = TUTARLAR.map(t => `
  <tr>
    <td>${bicim(t,0)} &#8378;</td>
    ${PARITELER.map(p => `<td class="d-${p.sembol}" id="fp-${p.sembol}-${t}">--</td>`).join("")}
  </tr>`).join("");

for(const p of PARITELER){
  const kutu = document.getElementById("fp-prim-" + p.sembol);
  let baslangic = FP_VARSAYILAN[p.sembol] ?? 0;
  try{
    const v = localStorage.getItem("fp_prim_" + p.sembol);
    if(v !== null && v !== "") baslangic = parseFloat(v);
  }catch(e){}
  kutu.value = baslangic;
  kutu.addEventListener("input", () => {
    try{ localStorage.setItem("fp_prim_" + p.sembol, kutu.value); }catch(e){}
    fpCiz();
  });
  fpKutular[p.sembol] = kutu;
}

function fpCiz(){
  for(const p of PARITELER){
    const fiyat = sonFiyat[p.sembol];
    if(fiyat === undefined) continue;
    const k = (parseFloat(fpKutular[p.sembol].value) || 0) / 100;
    const kur = fiyat * (1 + k);
    document.getElementById("fp-kur-" + p.sembol).textContent = bicim(kur, Math.min(p.basamak + 2, 4));
    for(const t of TUTARLAR){
      document.getElementById(`fp-${p.sembol}-${t}`).textContent = bicim(t / kur, 2);
    }
  }
}

const URL_24 = "https://api.binance.com/api/v3/ticker/24hr?symbols="
  + encodeURIComponent(JSON.stringify(PARITELER.map(p => p.sembol)));

function ciz(d){
  const p = PARITELER.find(x => x.sembol === d.symbol);
  if(!p) return;
  const b = p.basamak;
  const fiyat = +d.lastPrice, alis = +d.bidPrice, satis = +d.askPrice, yuzde = +d.priceChangePercent;

  const sinif = yuzde > 0 ? "yesil" : (yuzde < 0 ? "kirmizi" : "notr");
  const ok    = yuzde > 0 ? "▲" : (yuzde < 0 ? "▼" : "▬");

  const ef = document.getElementById("f-"+p.sembol);
  ef.textContent = bicim(fiyat, b) + " ₺";
  ef.className = "fiyat " + sinif;

  const ed = document.getElementById("d-"+p.sembol);
  ed.textContent = `${ok} %${bicim(Math.abs(yuzde), 2)}`;
  ed.className = "degisim " + sinif;

  document.getElementById("r-"+p.sembol).textContent =
    `24s ${bicim(+d.lowPrice, b)} - ${bicim(+d.highPrice, b)}`;
  document.getElementById("s-"+p.sembol).innerHTML =
    `alis ${bicim(alis,b)} &nbsp;·&nbsp; satis ${bicim(satis,b)} &nbsp;·&nbsp; makas ${bicim(satis-alis, b+1)}`;

  for(const t of TUTARLAR){
    document.getElementById(`t-${p.sembol}-${t}`).textContent = bicim(t / fiyat, 2);
  }

  sonFiyat[p.sembol] = fiyat;
  fpCiz();
}

function durum(ok){
  const e = document.getElementById("durum");
  const saat = new Date().toLocaleTimeString("tr-TR");
  e.className = ok ? "" : "kopuk";
  e.innerHTML = `<span class="nokta"></span>` + (ok ? "guncellendi " : "baglanti yok ") + saat;
}

async function getir(){
  try{
    const c = await fetch(URL_24, {cache:"no-store"});
    if(!c.ok) throw new Error(c.status);
    (await c.json()).forEach(ciz);
    durum(true);
  }catch(e){
    durum(false);
  }
}

let zamanlayici = null;
function basla(){
  getir();
  clearInterval(zamanlayici);
  zamanlayici = setInterval(getir, YENILEME_MS);
}
function dur(){ clearInterval(zamanlayici); zamanlayici = null; }

// telefonda ekran kapaliyken bos yere istek atmasin
document.addEventListener("visibilitychange", () =>
  document.hidden ? dur() : basla());
basla();
</script>
</body>
</html>
